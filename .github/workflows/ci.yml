name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config gcc gettext \
            libglib2.0-dev libgtk-3-dev libwnck-3-dev \
            libxfce4panel-2.0-dev libxfce4util-dev libxfconf-0-dev

      - name: Configure
        run: meson setup build -Dwarning_level=2 -Dwerror=true

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      # The core library must never gain a GTK or xfconf dependency: that
      # separation is what keeps it unit-testable without a display.
      - name: Assert core stays free of GTK and xfconf symbols
        run: |
          leaked=$(nm -u build/liblc-core.a 2>/dev/null | grep -icE 'gtk_|xfconf_|wnck_' || true)
          echo "leaked symbols: $leaked"
          test "$leaked" -eq 0

      # The CSS alpha bug was invisible under LC_ALL=C and broke every colour
      # under any comma-decimal locale. Re-run the suite under one so a
      # regression cannot pass CI.
      - name: Test under a comma-decimal locale
        run: |
          sudo locale-gen es_ES.UTF-8
          sudo update-locale
          LC_ALL=es_ES.UTF-8 LC_NUMERIC=es_ES.UTF-8 meson test -C build --print-errorlogs

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot lintian \
            meson ninja-build pkg-config gcc gettext \
            libglib2.0-dev libgtk-3-dev libwnck-3-dev \
            libxfce4panel-2.0-dev libxfce4util-dev libxfconf-0-dev

      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Lint the package
        run: lintian ../*.deb || true

      # dpkg-buildpackage writes to the parent directory, and
      # upload-artifact rejects any path containing "..", so move the
      # results inside the workspace first.
      - name: Collect the package
        run: |
          mkdir -p dist
          mv ../*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
