schema: spec-driven

context: |
  Project: xfce4-window-button-colors (renamed from xfce4-launcher-colors after a
  product pivot: per-window tasklist button colors, not launcher backgrounds)
  Tech stack: C11, Meson + Ninja, GLib/GIO, GTK 3, libwnck 3, gettext (po/)
  Layout: src/core/ (pure glib/gio, CI-enforced free of gtk_/xfconf_/wnck_ symbols) +
  src/glue/ (all GTK + libwnck code, module entry point, tasklist hook, menu, dialogs)
  Packaging: Debian .deb via debhelper/meson, lintian-clean; GitHub Actions CI + a
  tag-driven release workflow that refuses to publish on tag/meson.build/changelog drift
  Testing: meson test -C build; 6 suites (guard, color, css, paths, winid, winstore);
  CI re-runs the full suite under LC_ALL=es_ES.UTF-8 to guard a fixed locale CSS bug
  Status: v0.1.0 released; module installed but not enabled by default
  License: GPL-2.0-or-later

strict_tdd: true  # single workspace test command (meson test -C build) covers all 6 suites; tests carry RED-test provenance comments
artifact_store: hybrid
execution_mode: auto
delivery_strategy: auto-chain

testing:
  test_command: "meson test -C build"
  build_command: "meson setup build && ninja -C build"
  coverage_threshold: 0
  status: active   # 6 suites passing under CI, including the es_ES.UTF-8 locale re-run
  toolchain_present:
    - "meson, ninja, gcc, pkg-config, gettext (CI: ubuntu-24.04)"
    - "glib-2.0 >= 2.56, gio-2.0 >= 2.56"
    - "gtk+-3.0 >= 3.22, gmodule-2.0, libwnck-3.0"
    - "libxfconf-0-dev (packaging build-dep; debian/control is the authoritative contract, D6)"
    - "debhelper-compat 13, devscripts, fakeroot, lintian"
  ci:
    - "build-and-test job: meson setup -Dwarning_level=2 -Dwerror=true, meson compile, meson test --print-errorlogs"
    - "asserts liblc-core.a has zero gtk_/xfconf_/wnck_ symbols via nm -u"
    - "re-runs meson test under LC_ALL=es_ES.UTF-8 LC_NUMERIC=es_ES.UTF-8 (regression guard for a locale-dependent CSS formatting bug)"
    - "package job: dpkg-buildpackage -us -uc -b, then lintian"
    - "release.yml (tag push v*): refuses to publish when tag/meson.build/debian changelog versions disagree"

rules:
  proposal:
    - Include rollback plan for risky changes (module must never crash xfce4-panel; fail silently)
    - Preserve the src/core/ vs src/glue/ boundary; core must stay glib/gio-only (no gtk_/xfconf_/wnck_ symbols)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document any change to the CSS provider priority/attach/detach lifecycle in src/glue/lc-provider.c
    - Document any change to tasklist window-button detection/tagging in src/glue/lc-tasklist.c
  tasks:
    - Keep tasks completable in one session
    - Any new testable logic goes in src/core/ first, glue wiring follows
  apply:
    guidelines:
      - Follow XFCE/GTK3 C conventions (GLib naming, g_autoptr where applicable)
      - Never add a GTK, xfconf, or libwnck dependency to src/core/ — CI enforces this via nm -u symbol scan
      - Never allow the module to crash xfce4-panel; fail silently
    tdd: true    # RED-then-GREEN discipline confirmed in tests/ (e.g. tests/test-color.c RED-test header comments)
    test_command: "meson test -C build"
  verify:
    test_command: "meson test -C build"
    build_command: "meson setup build && ninja -C build"
    coverage_threshold: 0
    locale_regression_check: "LC_ALL=es_ES.UTF-8 LC_NUMERIC=es_ES.UTF-8 meson test -C build --print-errorlogs"
  archive:
    - Warn before merging destructive deltas
